name: Idea or request
description: Suggest a feature, or support for another Beats model
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The problem it solves for you, and how you picture it working.
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Anything you know about how the buds do it
      description: Recordings or observations from the official app help a lot. See CONTRIBUTING.md.
